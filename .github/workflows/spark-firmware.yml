name: Build Spark product and factory firmware
on:
  push:
    branches: [labplus-claw]
    paths:
      - 'components/**'
      - 'application/**'
      - 'integration/labplus/**'
      - '.github/workflows/spark-firmware.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: [product, factory]
    container: espressif/idf:v5.5.4
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Prepare pinned SDK
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          git -C "$IDF_PATH" apply "$GITHUB_WORKSPACE/integration/labplus/patches/esp-idf.patch"
          python -m pip install esp-bmgr-assist
      - name: Build product
        if: matrix.image == 'product'
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd application/edge_agent
          cp ../../integration/labplus/build-config/sdkconfig sdkconfig
          cp ../../integration/labplus/build-config/partitions_16MB.csv partitions_16MB.csv
          cp ../../integration/labplus/build-config/dependencies.lock dependencies.lock
          sed -i "s|/Users/james/esp32-build/labplus-esp-claw|$GITHUB_WORKSPACE|g" dependencies.lock
          idf.py bmgr -c ./boards -b labplus_ledong_max_v1
          # bmgr performs an initial configure; restore the released product settings.
          cp ../../integration/labplus/build-config/sdkconfig sdkconfig
          idf.py build
      - name: Build factory
        if: matrix.image == 'factory'
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd application/spark_factory
          idf.py set-target esp32p4
          idf.py build
      - name: Package firmware and update tools
        run: python integration/labplus/tools/package_ci.py --image ${{ matrix.image }} --output release
      - name: Preserve configure diagnostics
        if: failure() && matrix.image == 'product'
        shell: bash
        run: |
          python -m pip show idf-component-manager esp-idf-kconfig
          grep -A4 ESP_VIDEO_USE_CUSTOMIZED_ESP_H264_VERSION application/edge_agent/main/Kconfig.projbuild
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('application/edge_agent/build/config/sdkconfig.json')
          if path.exists():
              config = json.loads(path.read_text())
              print({k: v for k, v in config.items() if 'ESP_VIDEO_USE_CUSTOMIZED' in k or k == 'IDF_TARGET'})
          for p in Path('application/edge_agent/build').glob('*kconfig*'):
              print(p, p.read_text()[:10000] if p.is_file() else '')
          PY
      - uses: actions/upload-artifact@v4
        if: failure() && matrix.image == 'product'
        with:
          name: spark-build-diagnostics-${{ github.sha }}
          path: |
            application/edge_agent/build/config/sdkconfig.json
            application/edge_agent/build/config/kconfig_menus.json
            application/edge_agent/build/config/kconfig_sources.in
            application/edge_agent/build/config/kconfig_projbuild.in
            application/edge_agent/build/CMakeCache.txt
      - uses: actions/upload-artifact@v4
        with:
          name: spark-${{ matrix.image }}-${{ github.sha }}
          path: release/
          if-no-files-found: error
